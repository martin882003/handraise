      <rect width="260" height="260" fill="#0c0c0c"/>
      <path fill="#fbfbf3" d="M128 48h16v16h-16zM96 64h64v16H96zM80 80h80v32H80zM80 112h80v16H80zM176 112h16v16h-16zM80 128h112v16H80zM80 144h96v32H80zM80 176h80v16H80zM96 192h48v16H96z"/>
