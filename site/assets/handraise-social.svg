  <text x="70" y="515" fill="#d7cabd" font-family="Inter, Arial, sans-serif" font-size="22">Model your codebase and the work—then safely run Claude Code and Codex.</text>
  <g transform="translate(70 560)" font-family="monospace" font-size="13" letter-spacing="1.3">
