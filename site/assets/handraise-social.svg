    <clipPath id="mark-round"><rect width="260" height="260" rx="58"/></clipPath>
    <clipPath id="orb-clip"><circle cx="910" cy="330" r="280"/></clipPath>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0c0b09"/>
  <rect width="1200" height="630" fill="url(#background-grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g clip-path="url(#orb-clip)">
    <rect x="605" y="20" width="610" height="610" fill="url(#dot-field)"/>
    <circle cx="910" cy="330" r="250" fill="none" stroke="#ff7a3d" stroke-opacity=".26"/>
    <ellipse cx="910" cy="330" rx="286" ry="104" fill="none" stroke="#ffb18e" stroke-opacity=".2" transform="rotate(18 910 330)"/>
    <ellipse cx="910" cy="330" rx="104" ry="286" fill="none" stroke="#68d6ad" stroke-opacity=".15" transform="rotate(-22 910 330)"/>
  </g>

  <g transform="translate(68 58)">
