<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="72%" cy="45%" r="58%">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity=".24"/>
      <stop offset=".46" stop-color="#ff7a3d" stop-opacity=".07"/>
      <stop offset="1" stop-color="#0c0b09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="background-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#f4f3ee" stroke-opacity=".035"/>
    </pattern>
    <pattern id="dot-field" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="4" height="4" rx=".7" fill="#ff7a3d" fill-opacity=".35"/>
    </pattern>
    <pattern id="mark-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#343638" stroke-width="1"/>
