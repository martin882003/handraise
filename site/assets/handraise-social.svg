    <text x="78" y="27" fill="#fff7ed" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">Handraise</text>
    <text x="78" y="47" fill="#a09488" font-family="monospace" font-size="10" letter-spacing="1.2">AGENTIC SOFTWARE WORKBENCH</text>
  </g>

  <g transform="translate(68 194)" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="750" letter-spacing="-4">
